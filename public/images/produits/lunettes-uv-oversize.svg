<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e24aa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d675;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Motif géométrique -->
  <pattern id="wax" width="40" height="40" patternUnits="userSpaceOnUse">
    <polygon points="0,0 20,0 20,20 0,20" fill="rgba(212,175,55,0.05)"/>
    <polygon points="20,20 40,20 40,40 20,40" fill="rgba(212,175,55,0.05)"/>
  </pattern>
  <rect width="800" height="800" fill="url(#wax)"/>
  
  <!-- Lunettes oversize stylisées -->
  <!-- Monture gauche -->
  <ellipse cx="270" cy="400" rx="170" ry="110" fill="#1a1a1a" stroke="url(#gold)" stroke-width="8"/>
  <ellipse cx="270" cy="400" rx="145" ry="88" fill="#2d1b69" opacity="0.7"/>
  <!-- Reflet -->
  <ellipse cx="230" cy="365" rx="50" ry="25" fill="rgba(255,255,255,0.15)" transform="rotate(-20,230,365)"/>
  
  <!-- Pont (connexion) -->
  <rect x="438" y="388" width="124" height="24" rx="12" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4"/>
  
  <!-- Monture droite -->
  <ellipse cx="630" cy="400" rx="170" ry="110" fill="#1a1a1a" stroke="url(#gold)" stroke-width="8"/>
  <ellipse cx="630" cy="400" rx="145" ry="88" fill="#2d1b69" opacity="0.7"/>
  <!-- Reflet -->
  <ellipse cx="590" cy="365" rx="50" ry="25" fill="rgba(255,255,255,0.15)" transform="rotate(-20,590,365)"/>
  
  <!-- Branches (branches) gauche -->
  <rect x="40" y="392" width="100" height="16" rx="8" fill="url(#gold)"/>
  <!-- Branches droite -->
  <rect x="760" y="392" width="100" height="16" rx="8" fill="url(#gold)" transform="rotate(180,810,400)"/>
  
  <!-- Vis dorées -->
  <circle cx="100" cy="400" r="10" fill="url(#gold)"/>
  <circle cx="700" cy="400" r="10" fill="url(#gold)"/>
  
  <!-- Étoiles dorées déco -->
  <text x="120" y="180" font-size="30" fill="url(#gold)" opacity="0.7">✦</text>
  <text x="650" y="620" font-size="25" fill="url(#gold)" opacity="0.6">✦</text>
  <text x="680" y="200" font-size="20" fill="rgba(212,175,55,0.5)">★</text>
  
  <!-- Texte UV protection -->
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="url(#gold)" letter-spacing="3">PROTECTION UV 100%</text>
  
  <!-- Badge premium -->
  <rect x="280" y="610" width="240" height="50" rx="25" fill="url(#gold)"/>
  <text x="400" y="642" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4a0080" font-weight="bold">OVERSIZE LUXE</text>
</svg>
